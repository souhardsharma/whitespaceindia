# Throwaway: reads one public education source from GitHub's runner. Serves nothing; deleted afterwards.
name: edu-probe
on:
  workflow_dispatch:
    inputs:
      relist: {description: "1 = re-read relist.json", default: "1"}
      states: {description: "states for a fresh sample after the relist", default: "MP"}
      reload: {description: "1 = fresh token per district", default: "1"}
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Runner address
        run: curl -s --max-time 10 https://ipinfo.io/json | grep -E '"(country|org)"' || true
      - name: Probe
        env:
          PV_RELIST: ${{ github.event.inputs.relist }}
          PV_STATES: ${{ github.event.inputs.states }}
          PV_RELOAD: ${{ github.event.inputs.reload }}
          PV_CAP: "600"
        run: python -I -X utf8 pvrun.py || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-out
          path: out/
          retention-days: 5
