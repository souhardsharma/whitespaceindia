# Throwaway: reads one public municipal purchase-order view from GitHub's runner. Serves nothing; deleted afterwards.
name: edu-probe
on:
  push:
    branches: [probe-edu-bmc-orders]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Runner address
        run: curl -s --max-time 10 https://ipinfo.io/json | grep -E '"(country|region|org)"' || true
      # Run 44392720118 got HTTP 403 on the first GET of every session. Record what the refusal says, three
      # requests 20 s apart, so the cause (address, path, or the host as a whole) is on file.
      - name: What the refusal says
        run: |
          mkdir -p out
          for path in /sap/bc/webdynpro/sap/zpur_order_data /sap/public/bc/ur/nw7/js/lightspeed.js /; do
            curl -s --max-time 30 -D - -o "out/body_$(echo $path | tr '/' '_').html" -w "HTTP %{http_code} %{size_download} bytes $path\n" "https://r3appprd.sap.mcgm.gov.in$path" | tee -a out/log.txt
            sleep 20
          done
          head -c 1500 out/body__sap_bc_webdynpro_sap_zpur_order_data.html || true
      - uses: actions/upload-artifact@v4
        with:
          name: probe-out
          path: out/
          retention-days: 5
