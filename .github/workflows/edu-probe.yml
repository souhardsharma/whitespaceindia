# Throwaway: reads candidate education sources from GitHub's runner. Serves nothing; deleted afterwards.
name: edu-probe
on:
  push:
    branches: [probe-edu-reopen-procurement]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Runner address
        run: curl -s --max-time 10 https://ipinfo.io/json | grep -E '"(ip|country|org)"' || true
      - name: Indian pool
        env:
          EDUCATION_CACHE_DIR: ${{ runner.temp }}/edu
        run: |
          pip install -q pysocks==1.7.1
          python -I -X utf8 scripts/education/refresh_pool.py india --max-minutes 10 || true
          wc -l "$EDUCATION_CACHE_DIR/pools/india.txt" || true
      - name: Third-party CPPP dump (size first; fetched only if under 6 GB)
        continue-on-error: true
        run: |
          mkdir -p dump out
          curl -sSI --max-time 60 https://mirror.s3.surf/tenders_vps.db | tee out/dump_head.txt
          size=$(grep -i '^content-length' out/dump_head.txt | tr -dc '0-9')
          echo "size=$size"
          if [ -n "$size" ] && [ "$size" -lt 6000000000 ]; then
            start=$(date +%s)
            curl -sS --max-time 1500 -o dump/tenders_vps.db https://mirror.s3.surf/tenders_vps.db
            echo "download_secs=$(( $(date +%s) - start ))" >> out/dump_head.txt
            sha256sum dump/tenders_vps.db >> out/dump_head.txt
          fi
          df -h . >> out/dump_head.txt
      - name: Probe
        env:
          EDUCATION_CACHE_DIR: ${{ runner.temp }}/edu
          CAP_CPPP: "150"
          CAP_BIDPLUS: "60"
          CAP_GEM: "10"
        run: python -I -X utf8 probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-out
          path: out/
          retention-days: 5
