# Throwaway: reads one public municipal purchase-order view from GitHub's runner. Serves nothing; deleted afterwards.
name: edu-probe
on:
  push:
    branches: [probe-edu-bmc-orders]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Runner address
        run: curl -s --max-time 10 https://ipinfo.io/json | grep -E '"(country|org)"' || true
      - name: Probe
        run: |
          mkdir -p out
          python -I -X utf8 wd_probe.py runner 02.11.2026 08.11.2026 out/w1102.json | tee out/log.txt || true
          python -I -X utf8 wd_probe.py runner 09.11.2026 15.11.2026 out/w1109.json | tee -a out/log.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: probe-out
          path: out/
          retention-days: 5
