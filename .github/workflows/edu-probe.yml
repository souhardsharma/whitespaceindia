# Throwaway: reads a candidate education source from GitHub's runner. Serves nothing.
name: edu-probe
on:
  push:
    branches: [probe-edu-hunt-schoolbuild]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Runner address
        run: curl -s --max-time 10 https://ipinfo.io/json | grep -E '"(ip|country|org)"' || true
      - name: DNS and reach
        run: |
          getent ahosts schoolinfra.ap.gov.in || true
          dig +short A schoolinfra.ap.gov.in @8.8.8.8 || true
          dig +short AAAA schoolinfra.ap.gov.in @8.8.8.8 || true
          dig +short A schoolinfra.ap.gov.in @1.1.1.1 || true
          for i in 1 2 3; do curl -4 -s -o /dev/null -w '%{http_code} %{time_total}s %{remote_ip}
' --max-time 40 https://schoolinfra.ap.gov.in/stmsworks/Dashboard/Glance_Report.aspx || echo "curl4 fail $?"; sleep 5; done
          curl -6 -s -o /dev/null -w '%{http_code} %{remote_ip}
' --max-time 30 https://schoolinfra.ap.gov.in/stmsworks/Dashboard/Glance_Report.aspx || echo "curl6 fail $?"
          curl -4 -s -o /dev/null -w '%{http_code} %{time_total}s
' --max-time 30 https://cse.ap.gov.in/ || echo "cse fail $?"
      - name: Indian pool
        env:
          EDUCATION_CACHE_DIR: ${{ runner.temp }}/edu
        run: |
          pip install -q pysocks==1.7.1
          python -I -X utf8 scripts/education/refresh_pool.py india --max-minutes 10 || true
          wc -l "$EDUCATION_CACHE_DIR/pools/india.txt" || true
      - name: Probe
        env:
          EDUCATION_CACHE_DIR: ${{ runner.temp }}/edu
        run: MINUTES=20 python -I -X utf8 probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-out
          path: out/
          retention-days: 5
