# Throwaway: reads public map files from GitHub's runner and uploads counts. Serves nothing; deleted afterwards.
name: edu-probe-cal300
on:
  push:
    branches: [probe-edu-300cal]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: probe-edu-300cal
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Runner address
        run: curl -s --max-time 10 https://ipinfo.io/json | grep -E '"(country|org)"' || true
      - name: Read calendar 2025
        env:
          WORKERS: "6"
        run: python -I -X utf8 cal.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cal300
          path: out/
          retention-days: 5
