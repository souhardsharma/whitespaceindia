# Throwaway: does each education source answer GitHub's runners?
# Serves nothing, writes nothing. The branch is deleted after the run.
name: edu-reach
on:
  push:
    branches: [probe-edu-reach]
permissions:
  contents: read
jobs:
  reach:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Runner address
        run: curl -s -m 10 https://ipinfo.io/json || true
      - name: Probe
        run: |
          set -u
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          printf '| url | code | bytes | seconds | first bytes |\n|---|---|---|---|---|\n' > out.md
          while read -r url; do
            [ -z "$url" ] && continue
            res=$(curl -s -L --max-redirs 3 -o body.bin -w '%{http_code} %{size_download} %{time_total}' -m 30 -A "$UA" "$url" 2>/dev/null || echo "000 0 0")
            set -- $res
            head=$(head -c 90 body.bin 2>/dev/null | tr -d '\n\r|`' | tr -c '[:print:]' ' ')
            printf '| %s | %s | %s | %s | %s |\n' "$url" "$1" "$2" "$3" "$head" >> out.md
            sleep 1
          done < urls.txt
          cat out.md >> "$GITHUB_STEP_SUMMARY"
          cat out.md
      - uses: actions/upload-artifact@v4
        with:
          name: reach
          path: out.md
