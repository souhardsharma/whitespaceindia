# Throwaway: reads university result registers from GitHub's runner. Serves nothing; deleted afterwards.
name: edu-probe-hunt-results
on:
  push:
    branches: [probe-edu-hunt-results]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Runner address
        run: curl -s --max-time 10 https://ipinfo.io/json | grep -E '"(ip|country|org)"' || true
      - name: OCR tools
        run: sudo apt-get install -y -q tesseract-ocr poppler-utils > /dev/null
      - name: Probe
        run: python3 -I -X utf8 probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: probe-out
          path: out/
          retention-days: 5
