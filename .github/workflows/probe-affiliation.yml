# Throwaway: reads CBSE's public affiliated-school pages from GitHub's runner. Serves nothing.
name: edu-probe-affiliation
on:
  push:
    branches: [probe-edu-hunt-affiliation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Runner address
        run: curl -s --max-time 10 https://ipinfo.io/json | grep -E '"(country|org)"' || true
      - name: Read
        env:
          STATES: "28,27,5"
          CAP: "3200"
          MINUTES: "100"
          PAUSE: "0.8"
        run: python -I -X utf8 read_saras.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-out
          path: out/
          retention-days: 5
