# Throwaway: reads candidate education sources from GitHub's runner. Serves nothing; deleted afterwards.
name: edu-probe
on:
  push:
    branches: [probe-edu-hunt-water]
  workflow_dispatch:
    inputs:
      plan:
        description: "JSON plan (empty = plan.json)"
        default: ""
      cap:
        default: "600"
      pause:
        default: "1.0"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Runner address
        run: curl -s --max-time 10 https://ipinfo.io/json | grep -E '"(ip|country|org)"' || true
      - name: Probe
        env:
          EDUCATION_CACHE_DIR: ${{ runner.temp }}/edu
          PLAN_JSON: ${{ inputs.plan }}
          CAP: ${{ inputs.cap || '600' }}
          PAUSE: ${{ inputs.pause || '1.0' }}
        run: |
          pip install -q cryptography==43.0.3 pysocks==1.7.1
          python -I -X utf8 wqrun.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-out
          path: out/
          retention-days: 5
