# Throwaway: reads public hazard feeds and school registers from GitHub's runner. Serves nothing.
name: edu-probe
on:
  push:
    branches: [probe-edu-hunt-g-emergency]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Runner address
        run: curl -s --max-time 10 https://ipinfo.io/json | grep -E '"(country|org)"' || true
      - name: Archive tools
        run: sudo apt-get install -y -q libarchive-tools unar >/dev/null 2>&1 || true
      - name: Probe
        run: python -I -X utf8 probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-out
          path: out/
          retention-days: 5
