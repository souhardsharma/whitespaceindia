# Throwaway: reads candidate education sources from GitHub's runner. Serves nothing; deleted afterwards.
name: edu-probe
on:
  push:
    branches: [probe-edu-hunt-earlychild]
  workflow_dispatch:
    inputs:
      stage:
        description: "comma list for poshan.py: cadence, sample, bench, cases (empty = none)"
        default: ""
      arg:
        description: "stage argument (JSON)"
        default: "{}"
      static:
        description: "run probes.json too (yes/no)"
        default: "no"
      india:
        default: "no"
      reopen:
        description: "comma list for reopen.py (empty = plan.json on push only)"
        default: ""
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Runner address
        run: curl -s --max-time 10 https://ipinfo.io/json | grep -E '"(ip|country|org)"' || true
      - name: Indian pool (only when a probe needs it)
        if: inputs.india == 'yes'
        env:
          EDUCATION_CACHE_DIR: ${{ runner.temp }}/edu
        run: |
          pip install -q pysocks==1.7.1
          python -I -X utf8 scripts/education/refresh_pool.py india --max-minutes 10 || true
          wc -l "$EDUCATION_CACHE_DIR/pools/india.txt" || true
      - name: Static probes
        if: inputs.static == 'yes'
        env:
          EDUCATION_CACHE_DIR: ${{ runner.temp }}/edu
        run: python -I -X utf8 probe.py
      - name: Poshan stages
        if: github.event_name != 'push' && inputs.stage != ''
        env:
          EDUCATION_CACHE_DIR: ${{ runner.temp }}/edu
          STAGE: ${{ github.event_name == 'push' && 'cadence,sample' || inputs.stage }}
          ARG: ${{ github.event_name == 'push' && '{}' || inputs.arg }}
        run: python -I -X utf8 poshan.py
      - name: Reopen stages
        if: github.event_name == 'push' || inputs.reopen != ''
        env:
          STAGE: ${{ inputs.reopen }}
          ARG: ${{ github.event_name == 'push' && '' || inputs.arg }}
        run: python -I -X utf8 reopen.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-out
          path: out/
          retention-days: 5
