# Throwaway: reads one public education source from GitHub's runner. Serves nothing; deleted afterwards.
name: edu-probe
on:
  push:
    branches: [probe-edu-leavecover]
  workflow_dispatch:
    inputs:
      mode:
        description: "sample (six districts) or statewide (short-term, every block)"
        default: sample
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Runner address
        run: curl -s --max-time 10 https://ipinfo.io/json | grep -E '"(country|org)"' || true
      - name: Probe
        env:
          MODE: ${{ github.event.inputs.mode || 'sample' }}
        run: python -I -X utf8 probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: probe-out
          path: out/
          retention-days: 5
